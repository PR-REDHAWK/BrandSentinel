services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brandsentinel-postgres
    restart: always
    environment:
      POSTGRES_DB: brandsentinel
      POSTGRES_USER: brandsentinel
      POSTGRES_PASSWORD: brandsentinel_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandsentinel -d brandsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brandsentinel-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://brandsentinel:brandsentinel_password@postgres:5432/brandsentinel
      - JWT_SECRET=${JWT_SECRET:-brandsentinel_super_secret_jwt_key_change_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ENVIRONMENT=production
      - AUTO_SEED=true
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brandsentinel-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  backend_uploads:
