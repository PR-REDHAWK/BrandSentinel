services:
  # Backend API (FastAPI + Docker with Tesseract OCR)
  - type: web
    name: brandsentinel-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: brandsentinel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Frontend (Next.js)
  - type: web
    name: brandsentinel-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: oregon
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: brandsentinel-api
          property: host
          valueTemplate: "https://${VALUE}/api/v1"

databases:
  # PostgreSQL Database
  - name: brandsentinel-db
    plan: free
    region: oregon
    databaseName: brandsentinel
    user: brandsentinel
